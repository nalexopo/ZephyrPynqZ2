# UDP echo server on port 4242 (src/socket_echo.c)
CONFIG_POSIX_API=y
CONFIG_MAIN_STACK_SIZE=4096

# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_ARP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=4

# No hardware entropy source on Zynq-7000 PS; the network stack needs one
CONFIG_TEST_RANDOM_GENERATOR=y

# Ethernet: Xilinx GEM + generic MII PHY over the GEM MDIO
CONFIG_ETH_DRIVER=y
CONFIG_ETH_XLNX_GEM=y

# Static IPv4 address, applied at boot by net_config.
# Adjust to your LAN. For DHCP instead: set CONFIG_NET_DHCPV4=y and
# leave CONFIG_NET_CONFIG_MY_IPV4_ADDR unset.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.98"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.3"

# Buffers
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Diagnostics: logging (the board defconfig turns it off), net shell, stats.
# Useful shell commands: "net iface", "net stats", "net arp", "net ping <ip>"
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NET_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_PHY_LOG_LEVEL_INF=y
CONFIG_NET_CONFIG_LOG_LEVEL_INF=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
