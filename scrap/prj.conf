CONFIG_GPIO=y
CONFIG_GPIO_ZYNQ=y
CONFIG_NET_ETHERNET_FORCE_100MBPS=y
# General config
CONFIG_POSIX_API=y

# Networking Core config
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SOCKETS=y


# Protocol support
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Turn this OFF: Mapping IPv4 to IPv6 causes issues when IPv6 is disabled
CONFIG_NET_IPV4_MAPPING_TO_IPV6=n

# CRITICAL ETHERNET PLUMBING
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y

# Driver & Random Support
CONFIG_TEST_RANDOM_GENERATOR=y

# Network Address Config (Matches your 192.168.1.x network layout)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=30

CONFIG_NET_CONFIG_NEED_IPV6=y
#CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.98"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.3"
#CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"


CONFIG_NET_ARP=y
CONFIG_NET_ICMPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y

# System Buffers (Crucial for Gigabit/Fast Ethernet data handling)
CONFIG_NET_ETH_PAD_TX=y
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_BUF_ALIGNMENT=4
CONFIG_NET_CONFIG_NEED_IPV4_BOOT_TIME=y
CONFIG_NET_TCP_CHECKSUM=y
CONFIG_NET_UDP_CHECKSUM=y

# Enable the Xilinx GEM driver
CONFIG_ETH_XLNX_GEM=y


# Optional: Networking shell to debug live interfaces

# Ensure the network manager has sufficient resources
CONFIG_NET_MAX_CONN=4
CONFIG_NET_MAX_CONTEXTS=4


CONFIG_ETH_DRIVER=y


CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
# Crucial for driver memory allocations and socket tracking
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Give the core network management thread room to process packages
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096


CONFIG_NET_IF_LOG_LEVEL_DBG=y
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=y
CONFIG_NET_CONN_LOG_LEVEL_DBG=y
CONFIG_NET_CONTEXT_LOG_LEVEL_DBG=y
CONFIG_NET_SHELL=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
CONFIG_NET_UDP_LOG_LEVEL_DBG=y
CONFIG_NET_DEBUG_DHCPV4=y
CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=y
# TURN OFF hardware offloading so the driver stops corrupting the validation
CONFIG_NET_TX_CHECKSUM_OFFLOAD=n
CONFIG_NET_RX_CHECKSUM_OFFLOAD=n

# Explicitly force Zephyr to use its robust software parsing engine instead
CONFIG_NET_CHECKSUM_OFFLOAD=n


# Enforce standard ethernet framing sizes
CONFIG_NET_ETH_MTU=1500
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y

CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y


CONFIG_NET_IPV4_NAT=y
CONFIG_NET_MGMT_EVENT_MONITOR=y

CONFIG_WEBSOCKET_CLIENT=y
