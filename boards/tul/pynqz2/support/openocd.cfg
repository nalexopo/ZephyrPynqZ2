# ==============================================================================
# OpenOCD Configuration for TUL PYNQ-Z2 (Xilinx Zynq-7020 Dual Cortex-A9)
# Compatible with OpenOCD 0.12+
#
# Used by the "Debug Zephyr on PYNQ-Z2" entry in .vscode/launch.json and by
# debug.gdb. The board must be in JTAG boot mode (JP1 = JTAG).
#
# The Zynq target is defined here instead of sourcing target/zynq_7000.cfg so
# that only cpu0 is a GDB target: zynq_7000.cfg puts both cores in an SMP
# group, which makes every step/continue halt and resume cpu1 as well (it sits
# in the BootROM's WFE loop, Zephyr runs single core here) and shows GDB two
# threads. Doubles the JTAG traffic per step for nothing.
# ==============================================================================

# Interface Configuration (Onboard FTDI FT2232HL)
adapter driver ftdi
ftdi device_desc "TUL"
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0088 0x008b
reset_config none

# Transport & JTAG Speed
transport select jtag
adapter speed 10000

# Target: Zynq-7000 (PL TAP + ARM DAP)
jtag newtap zynq_pl bs -irlen 6 -ircapture 0x1 -irmask 0x03 \
    -expected-id 0x03727093 -expected-id 0x13727093 -expected-id 0x23727093 \
    -expected-id 0x03722093 -expected-id 0x13722093 -expected-id 0x23722093
jtag newtap zynq cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477
dap create zynq.dap -chain-position zynq.cpu

target create zynq.cpu0 cortex_a -dap zynq.dap -coreid 0 -dbgbase 0x80090000
target create zynq.cpu1 cortex_a -dap zynq.dap -coreid 1 -dbgbase 0x80092000 \
    -gdb-port disabled
# AHB-AP: system bus access that does not go through a CPU. Used for the SLCR
# soft reset, which would otherwise be issued by (and kill) the core that is
# carrying the debugger's own memory write.
target create zynq.ahb mem_ap -dap zynq.dap -ap-num 0 -gdb-port disabled

zynq.cpu0 configure -event reset-assert-post "cortex_a dbginit"
zynq.cpu1 configure -event reset-assert-post "cortex_a dbginit"

targets zynq.cpu0

# 4. Debug behaviour (these are what make stepping usable in VS Code)
#  - maskisr: with CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000 the private timer
#    fires every 100 us, so without this every "step"/"next" lands in the
#    timer ISR and GDB keeps single-stepping through it over JTAG.
#  - hard breakpoints: Zephyr maps text read-only through the MMU and keeps the
#    L2 on; hardware breakpoints need no memory writes / cache maintenance.
#    The A9 has 6 of them; GDB's step uses one or two.
zynq.cpu0 configure -event gdb-attach {
    cortex_a maskisr on
    gdb_breakpoint_override hard
}

# ------------------------------------------------------------------------------
# 5. Board helpers, called from GDB as "monitor pynqz2_prepare <fsbl.elf>"
# ------------------------------------------------------------------------------

# Equivalent of XSCT "rst -system": SLCR soft reset (PSS_RST_CTRL) through the
# AHB-AP, then re-attach to the cores once the BootROM has run and re-enabled
# debug. The BootROM then parks (JTAG boot mode) waiting for the debugger.
proc pynqz2_reset {} {
    targets zynq.cpu0
    catch {halt}
    zynq.ahb mww 0xF8000008 0x0000DF0D
    # The DAP drops off while the PS resets: this write and the next
    # examination report errors (sticky DAP error) - expected.
    catch {zynq.ahb mww 0xF8000200 0x00000001}
    sleep 300
    catch {zynq.cpu0 arp_examine}
    catch {zynq.cpu1 arp_examine}
    # Let the BootROM finish and the background poller re-examine the cores.
    sleep 1500
    halt
}

# Equivalent of the first half of pynqz2.tcl: reset, run the FSBL for a few
# seconds (ps7_init: PLLs, DDR, MIO, clocks), then stop it in its JTAG idle
# loop. DDR is usable afterwards and GDB can "load" zephyr.elf.
proc pynqz2_prepare {fsbl} {
    pynqz2_reset
    load_image $fsbl
    resume 0
    sleep 3000
    halt
}

