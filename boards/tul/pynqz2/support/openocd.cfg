# ==============================================================================
# OpenOCD Configuration for TUL PYNQ-Z2 (Xilinx Zynq-7020 Dual Cortex-A9)
# Compatible with OpenOCD 0.12+ and Xilinx ps7_init.tcl
# ==============================================================================

# 1. Interface Configuration (Onboard FTDI FT2232HL)
adapter driver ftdi
ftdi device_desc "TUL"
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0088 0x008b
reset_config none

# 2. Transport & JTAG Speed
transport select jtag
adapter speed 10000

# 3. Target Configuration (Zynq-7000 Dual ARM Cortex-A9)
source [find target/zynq_7000.cfg]

# 4. Zynq SLCR Soft Reset Handler (Allows 'monitor reset halt' to work cleanly)
zynq.cpu0 configure -event reset-assert-pre {
    halt
    # Unlock SLCR registers
    mww phys 0xF8000008 0x0000DF0D
    # Assert system software reset (PSS_RST_CTRL)
    mww phys 0xF8000200 0x00000001
}

# 5. XSDB Compatibility Wrappers for Xilinx ps7_init.tcl (OpenOCD 0.12+)
proc mwr {args} {
    if {[llength $args] == 2} {
        set addr [lindex $args 0]
        set val  [lindex $args 1]
    } elseif {[llength $args] == 3 && [lindex $args 0] eq "-force"} {
        set addr [lindex $args 1]
        set val  [lindex $args 2]
    } else {
        error "Unsupported mwr arguments: $args"
    }
    mww phys $addr $val
}

proc mrd {addr} {
    return [lindex [read_memory $addr 32 1 phys] 0]
}

proc mask_write {addr mask val} {
    set curval [lindex [read_memory $addr 32 1 phys] 0]
    set newval [format "0x%08x" [expr {($curval & ~$mask) | ($val & $mask)}]]
    mww phys $addr $newval
}

proc mask_poll {addr mask} {
    set timeout 100
    while {$timeout > 0} {
        set val [lindex [read_memory $addr 32 1 phys] 0]
        if {($val & $mask) != 0} {
            return
        }
        sleep 1
        incr timeout -1
    }
    error "mask_poll timeout at $addr"
}
